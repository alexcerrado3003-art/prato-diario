<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prato Diário">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Prato Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de app de celular (máx. 480px) com barra de abas fixa embaixo; telas de tarefa abrem por cima, em tela cheia. */
:root {
  --bg: #ffffff; --surface: #f2f5f8; --raised: #ffffff; --border: #e2e8ee; --border-input: #7a8696;
  --text: #1c2a3f; --muted: #5a6779; --accent: #1f2d45; --on-accent: #ffffff; --link: #16756a;
  --band: #d4eee6; --band-ink: #1c2a3f; --chip: #e6f4ef;
  --danger: #c0392b; --success: #1f7a4d; --warning: #a15c00;
  --protein: #c4553a; --carbs: #2b78ad; --fat: #9a7000; --fiber: #7d5f3a; --track: #e2e8ee;
  --b1: #fdf0d8; --b2: #fde3dc; --b3: #dcefe9; --b4: #e8e4f8;
  --scrim: rgba(16,24,40,.45); --shadow-card: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
  --shadow-pop: 0 12px 32px rgba(16,24,40,.16);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 20px; --tab-h: 64px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151d; --surface: #18202b; --raised: #1f2833; --border: #2c3644; --border-input: #7a8696;
  --text: #edf1f5; --muted: #a2adbb; --accent: #e9eef5; --on-accent: #10151d; --link: #6fd3c1;
  --band: #173a36; --band-ink: #edf1f5; --chip: #1d3a36;
  --danger: #ff7b6e; --success: #4cc38a; --warning: #f0a647;
  --protein: #f08a6d; --carbs: #6cb6e6; --fat: #e2b84a; --fiber: #c9a575; --track: #2c3644;
  --b1: #3a3020; --b2: #3c2724; --b3: #1d3a36; --b4: #2b2840;
  --scrim: rgba(0,0,0,.6); --shadow-card: 0 1px 2px rgba(0,0,0,.4); --shadow-pop: 0 12px 32px rgba(0,0,0,.5);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10151d; --surface: #18202b; --raised: #1f2833; --border: #2c3644; --border-input: #7a8696;
  --text: #edf1f5; --muted: #a2adbb; --accent: #e9eef5; --on-accent: #10151d; --link: #6fd3c1;
  --band: #173a36; --band-ink: #edf1f5; --chip: #1d3a36;
  --danger: #ff7b6e; --success: #4cc38a; --warning: #f0a647;
  --protein: #f08a6d; --carbs: #6cb6e6; --fat: #e2b84a; --fiber: #c9a575; --track: #2c3644;
  --b1: #3a3020; --b2: #3c2724; --b3: #1d3a36; --b4: #2b2840;
  --scrim: rgba(0,0,0,.6); --shadow-card: 0 1px 2px rgba(0,0,0,.4); --shadow-pop: 0 12px 32px rgba(0,0,0,.5);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font: 400 16px/24px var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

.shell { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom, 0px)); }
.shell.full { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.row > .grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.xs { font-size: 12px; line-height: 16px; font-weight: 500; }
.sm { font-size: 14px; line-height: 20px; }
.lg { font-size: 20px; line-height: 28px; font-weight: 600; }
.xl { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -.01em; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.label { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 8px; min-height: 56px; margin-inline: -4px; }
.top h1 { font-size: 20px; line-height: 28px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: var(--r-md); color: var(--text); flex: none; }
.icon-btn:hover { background: var(--surface); }
.icon-btn svg { width: 22px; height: 22px; }

/* buttons */
.btn { min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 120ms var(--ease), opacity 120ms; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: var(--surface); border-color: var(--border); color: var(--text); }
.btn.ghost { background: transparent; color: var(--link); padding: 0 10px; }
.btn.danger { background: var(--danger); color: var(--on-accent); }
.btn.block { width: 100%; }
.btn.lg { min-height: 52px; font-size: 17px; }
.btn svg { width: 20px; height: 20px; }

/* cards */
.card { background: var(--raised); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 16px; }
:root[data-theme="dark"] .card, .card.flat { border: 1px solid var(--border); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card { border: 1px solid var(--border); } }
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 16px; }

/* date switcher */
.dates { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.dates .when { font-weight: 600; text-align: center; flex: 1; position: relative; }
.dates .when input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }

/* ring */
.today-sum { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.ring { position: relative; width: 150px; height: 150px; flex: none; }
.band .ring circle:first-child { stroke: rgba(255,255,255,.55); }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .arc { transition: stroke-dashoffset 200ms var(--ease); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-size: 34px; line-height: 38px; font-weight: 700; letter-spacing: -.02em; }
.macros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; width: 100%; }
.macros .mbar .head { flex-direction: column; gap: 0; }
.macros .mbar .head > span:first-child { font-size: 13px; color: var(--muted); white-space: nowrap; }
.mbar .head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; line-height: 20px; }
.mbar .track { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 6px; }
.mbar .fill { height: 100%; border-radius: 999px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }

/* water */
.water { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.water .cups { display: flex; gap: 4px; flex: 1; min-width: 120px; }
.water .cup { flex: 1; height: 10px; border-radius: 999px; background: var(--track); }
.water .cup.on { background: var(--carbs); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--raised); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"], .chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip { background: var(--chip); border-color: transparent; }

/* meals */
.meal { display: flex; flex-direction: column; gap: 4px; }
.meal-head { display: flex; align-items: center; gap: 8px; }
.meal-head h2 { font-size: 17px; line-height: 24px; font-weight: 600; flex: 1; }
.meal-head .kcal { font-weight: 400; display: block; }
.entry { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.entry:first-of-type { border-top: 0; }
.thumb { width: 48px; height: 48px; border-radius: var(--r-sm); object-fit: cover; background: var(--surface); flex: none; display: grid; place-items: center; color: var(--muted); }
.thumb svg { width: 22px; height: 22px; }
.entry .names { flex: 1; min-width: 0; }
.entry .names .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.add-line { color: var(--link); font-weight: 600; font-size: 15px; background: none; border: 0; padding: 8px 0; text-align: left; display: inline-flex; gap: 6px; align-items: center; min-height: 44px; }
.add-line svg { width: 18px; height: 18px; }

.band { background: var(--band); color: var(--band-ink); border-radius: var(--r-lg); padding: 20px 16px 16px; }
.band .ring .big { color: var(--band-ink); }
.sidestat { text-align: center; min-width: 64px; }
.sidestat b { display: block; font-size: 22px; line-height: 28px; }
.badge { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--text); }
.badge svg { width: 22px; height: 22px; }
.plus { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent); border: 0; display: grid; place-items: center; flex: none; }
.plus svg { width: 22px; height: 22px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.band .tile { background: var(--raised); }
.tile b { font-size: 20px; line-height: 26px; }
.pill { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px; background: var(--track); color: var(--text); margin-top: 4px; }
.pill.good { background: color-mix(in srgb, var(--success) 16%, var(--raised)); color: var(--success); }
.pill.warn { background: color-mix(in srgb, var(--warning) 16%, var(--raised)); color: var(--warning); }
.check { width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--border-input); background: var(--bg); display: grid; place-items: center; color: var(--success); flex: none; }
.check svg { width: 18px; height: 18px; }
.qchip { align-self: flex-start; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 8px; color: var(--text); }
.qbar { display: flex; gap: 6px; }
.qbar span { height: 4px; border-radius: 999px; background: var(--track); flex: 1; overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--accent); }
.timeline text { fill: var(--muted); font-size: 10px; font-family: var(--font); }
.brand { display: flex; align-items: center; gap: 8px; }
.wordmark { font-weight: 800; font-size: 18px; line-height: 22px; letter-spacing: -.02em; color: var(--text); }
.wordmark span { color: var(--link); }
.wordmark.big { font-size: 34px; line-height: 38px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 15px; border: 0; display: grid; place-items: center; flex: none; }
.avatar.lg { width: 64px; height: 64px; font-size: 24px; }
.hello { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -.01em; }
/* fab + tabbar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--raised); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar nav { max-width: 480px; margin: 0 auto; height: var(--tab-h); display: grid; grid-template-columns: 1fr 1fr 72px 1fr 1fr; align-items: center; }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 500; color: var(--muted); min-height: 52px; justify-content: center; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"] svg { background: var(--chip); border-radius: 999px; padding: 3px 14px; width: 52px; height: 30px; }
.fab { width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-pop); display: grid; place-items: center; justify-self: center; transform: translateY(-14px); }
.fab svg { width: 28px; height: 28px; color: var(--on-accent); }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade 160ms var(--ease); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--raised); border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--shadow-pop); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: up 200ms var(--ease); max-height: 90vh; overflow: auto; }
.sheet .inner { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.grabber { width: 40px; height: 4px; border-radius: 999px; background: var(--border); margin: 4px auto 4px; }
.option { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: var(--r-md); background: var(--surface); border: 0; text-align: left; min-height: 64px; width: 100%; }
.option .ico { width: 44px; height: 44px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; color: var(--link); flex: none; }
.option .ico svg { width: 22px; height: 22px; }
.option[disabled] { opacity: .5; }
.option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: 14px; font-weight: 600; }
.input, select.input, textarea.input { min-height: 48px; border: 1px solid var(--border-input); border-radius: var(--r-md); background: var(--bg); padding: 10px 14px; width: 100%; }
textarea.input { min-height: 120px; resize: vertical; }
.input:focus { border-color: var(--accent); outline: 2px solid color-mix(in srgb, var(--accent) 30%, transparent); outline-offset: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.hint { font-size: 13px; line-height: 18px; color: var(--muted); }
.err { color: var(--danger); font-size: 13px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--surface); padding: 4px; border-radius: var(--r-md); }
.seg button { min-height: 40px; border: 0; border-radius: var(--r-sm); background: transparent; font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--raised); box-shadow: var(--shadow-card); font-weight: 600; }
.choice { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--raised); width: 100%; }
.choice { background: var(--surface); border-color: transparent; border-radius: var(--r-lg); min-height: 64px; justify-content: center; }
.choice[aria-pressed="true"] { background: var(--chip); border-color: var(--link); box-shadow: inset 0 0 0 1px var(--link); }
.progress { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
.progress > div { height: 100%; background: var(--link); transition: width 200ms var(--ease); }

/* review rows */
.item { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--border); }
.item.warn { border-color: var(--warning); }
.item .top-line { display: flex; gap: 10px; align-items: flex-start; }
.item .nm { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; }
.item .nm .t { font-weight: 600; overflow-wrap: anywhere; }
.flag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--warning); }
.stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepper .box { display: flex; align-items: center; border: 1px solid var(--border-input); border-radius: var(--r-md); overflow: hidden; }
.stepper .box button { width: 44px; height: 44px; border: 0; background: var(--surface); font-size: 20px; font-weight: 500; }
.stepper .box input { width: 64px; height: 44px; border: 0; text-align: center; background: var(--bg); font-weight: 600; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
.photo-hero { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; object-fit: cover; border-radius: var(--r-lg); background: var(--surface); }

/* search */
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); }
.search input { padding-left: 44px; background: var(--surface); border-color: var(--border); }
.res { display: flex; gap: 12px; align-items: center; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--border); background: none; width: 100%; text-align: left; min-height: 56px; }
.res .grow .t { font-weight: 500; overflow-wrap: anywhere; }
.res-row { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--border); }
.res-row .res { border-bottom: 0; flex: 1; min-width: 0; }
.add-btn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--text); background: transparent; display: grid; place-items: center; flex: none; }
.add-btn svg { width: 20px; height: 20px; }
.count { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
.note { width: 100%; min-height: 72px; border: 0; background: var(--surface); border-radius: var(--r-md); padding: 10px 12px; resize: vertical; }
.src { font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 2px 6px; border-radius: 6px; background: var(--surface); color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 8px 12px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; min-height: 40px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
table.nut { width: 100%; border-collapse: collapse; font-size: 14px; }
table.nut td { padding: 8px 0; border-bottom: 1px solid var(--border); }
table.nut td:last-child { text-align: right; font-variant-numeric: tabular-nums; }

/* skeleton */
.sk { height: 56px; border-radius: var(--r-md); background: linear-gradient(90deg, var(--surface) 0%, var(--track) 50%, var(--surface) 100%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }

/* bottom action bar */
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bg); border-top: 1px solid var(--border); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.actionbar .inner { max-width: 480px; margin: 0 auto; display: flex; gap: 10px; }
.actionbar .btn { flex: 1; }

/* empty */
.empty { text-align: center; padding: 20px 8px; display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--muted); }
.empty svg { width: 32px; height: 32px; }

/* toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); width: max-content; bottom: calc(var(--tab-h) + 24px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--text); color: var(--bg); border-radius: var(--r-md); padding: 10px 10px 10px 16px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow-pop); max-width: calc(100% - 32px); font-size: 14px; font-weight: 500; animation: up 200ms var(--ease); }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; min-height: 36px; padding: 0 6px; }
.banner { border-radius: var(--r-md); padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; line-height: 20px; }
.banner.warn { border-color: var(--warning); }

/* charts */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.list-row { display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--border); }
.list-row:last-child { border-bottom: 0; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-md); border: 1px solid var(--danger); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  [/^alface|^rucula|^agriao|^couve/, [["1 prato de sobremesa", 30]]],

function portionsFor(food) {
  const out = [["100 g", 100]];
  if (food.portions) return [...food.portions, ...out];
  const hit = PORTIONS.find(([re]) => re.test(food.key || norm(food.name)));
  return hit ? [...hit[1], ...out] : out;
}

let customFoods = [];
function customToFood(c) { return { ref: "c" + c.id, id: c.id, name: c.name, cat: "Meus alimentos", kcal: c.kcal, p: c.p, c: c.c, f: c.f, fib: c.fib || 0, na: c.na || 0, src: "Meu", key: norm(c.name), portions: c.portionG ? [[c.portionLabel || "1 porção", c.portionG]] : null }; }
function foodByRef(ref) {
  if (!ref) return null;
  if (ref[0] === "t") return tacoById.get(Number(ref.slice(1))) || null;
  if (ref[0] === "i") return ibgeById.get(ref.slice(1)) || null;
  if (ref[0] === "c") { const c = customFoods.find((x) => "c" + x.id === ref); return c ? customToFood(c) : null; }
  return null;
}

function searchFoods(q, limit = 40) {
  const nq = norm(q).trim();
  if (!nq) return [];
  const toks = nq.split(/[\s,]+/).filter(Boolean);
  const wantsRaw = /\bcru/.test(nq);
  const pool = [...customFoods.map(customToFood), ...tacoFoods, ...ibgeFoods];
  const scored = [];
  for (const f of pool) {
    if (!toks.every((t) => f.key.includes(t))) continue;
    let s = 0;
    if (f.key.startsWith(toks[0])) s += 30;
    const words = f.key.split(/[\s,/]+/);
    for (const t of toks) if (words.includes(t)) s += 8;
    if (f.src === "Meu") s += 40;
    if (f.src === "IBGE") s -= 2;
    if (!wantsRaw && /\bcru/.test(f.key)) s -= 15;
    if (/cozid|grelhad|assad|refogad/.test(f.key)) s += 4;
    if (S.main.favs.includes(f.ref)) s += 20;
    s -= f.key.length / 20;
    scored.push([s, f]);
  }
  return scored.sort((a, b) => b[0] - a[0]).slice(0, limit).map((x) => x[1]);
}

/* ------------------------------------------------------------------ nutrição */
function itemFrom(food, grams, portionLabel) {
  const k = grams / 100;
  return { id: uid(), name: food.name, ref: food.ref, grams: r0(grams), portion: portionLabel || "",
    kcal: r1(food.kcal * k), p: r1(food.p * k), c: r1(food.c * k), f: r1(food.f * k), fib: r1((food.fib || 0) * k),
    na: food.na == null ? null : r0(food.na * k),
    per100: { kcal: food.kcal, p: food.p, c: food.c, f: food.f, fib: food.fib || 0, na: food.na ?? null } };
}
function regrams(it, grams) {
  const k = grams / 100, b = it.per100;
  Object.assign(it, { grams: r0(grams), kcal: r1(b.kcal * k), p: r1(b.p * k), c: r1(b.c * k), f: r1(b.f * k), fib: r1(b.fib * k), na: b.na == null ? null : r0(b.na * k) });
}
function sum(items) {
  return items.reduce((a, i) => ({ kcal: a.kcal + i.kcal, p: a.p + i.p, c: a.c + i.c, f: a.f + i.f, fib: a.fib + (i.fib || 0), na: a.na + (i.na || 0) }), { kcal: 0, p: 0, c: 0, f: 0, fib: 0, na: 0 });
}
const dayItems = (day) => (day?.meals || []).flatMap((m) => m.items);

// Mifflin-St Jeor + fator de atividade; proteína 1,6 g/kg, gordura 28% das kcal, resto carboidrato
const ACT = { sedentary: [1.2, "Sedentária", "Pouco movimento, trabalho sentado"], light: [1.375, "Leve", "Caminhadas ou exercício 1–3x por semana"], moderate: [1.55, "Moderada", "Exercício 3–5x por semana"], active: [1.725, "Alta", "Exercício quase todo dia"], very_active: [1.9, "Muito alta", "Treino intenso ou trabalho físico"] };
function ageFrom(birthYear) { return new Date().getFullYear() - Number(birthYear); }
function calcGoal(pr) {
  const w = Number(pr.weight), h = Number(pr.height), a = ageFrom(pr.birthYear);
  const bmr = 10 * w + 6.25 * h - 5 * a + (pr.sex === "male" ? 5 : -161);
  const tdee = Math.round(bmr * ACT[pr.activity][0]);
  const pc = PACE[pr.pace || "mid"];
  let kcal = tdee;
  const hf = healthFlags();
  if (pr.goal === "lose" && !hf.noDeficit) kcal *= 1 - pc[1];
  if (pr.goal === "gain") kcal *= 1 + pc[2];
  kcal = Math.max(pr.sex === "male" ? 1500 : 1200, Math.round(kcal / 10) * 10);
  const p = Math.round(Math.min(1.6 * w, (kcal * 0.35) / 4));
  const f = Math.round((kcal * 0.28) / 9);
  const c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
  return { kcal, tdee, p, c, f, fib: Math.round((kcal / 1000) * 14), water: Math.round((w * 35) / 100) * 100 };
}

/* ------------------------------------------------------------------ armazenamento: db privado do Claude, com reserva local */
const LS = {
  get(k) { try { const v = localStorage.getItem("pd:" + k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem("pd:" + k, JSON.stringify(v)); } catch {} },
  keys() { try { return Object.keys(localStorage).filter((k) => k.startsWith("pd:day:")).map((k) => k.slice(7)); } catch { return []; } },
};
const Store = {
  kind: "local", db: null, uid: null, chains: new Map(),
  async init() {
    try {
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const id = db && user ? await user.id() : null;
      if (db && id) { this.db = db; this.uid = id; this.kind = "db"; }
    } catch {}
  },
  mainRef() { return this.db.doc(`data/users/${this.uid}/main`); },
  dayRef(d) { return this.mainRef().collection("days").doc(d); },
  withTimeout(p) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), 10000))]); },
  // O banco entrega documentos congelados (somente leitura); o app sempre trabalha numa cópia própria (BUG-003)
  thaw(d) { return d == null ? null : JSON.parse(JSON.stringify(d)); },
  async getMain() {
    if (this.kind === "db") { const s = await this.withTimeout(this.mainRef().get()); return s.exists ? this.thaw(s.data()) : null; }
    return LS.get("main");
  },
  async getDay(d) {
    if (this.kind === "db") { const s = await this.withTimeout(this.dayRef(d).get()); return s.exists ? this.thaw(s.data()) : null; }
    return LS.get("day:" + d);
  },
  async getDays(from, to) {
    if (this.kind === "db") {
      const s = await this.withTimeout(this.mainRef().collection("days").where("date", ">=", from).where("date", "<=", to).get());
      return s.docs.map((x) => this.thaw(x.data()));
    }
    return LS.keys().filter((d) => d >= from && d <= to).map((d) => LS.get("day:" + d)).filter(Boolean);
  },
  write(key, ref, data) {
    // uma escrita por documento de cada vez
    const prev = this.chains.get(key) || Promise.resolve();
    const body = JSON.parse(JSON.stringify(data));
    const next = prev.catch(() => {}).then(() => this.kind === "db" ? ref().set(body) : LS.set(key, body));
    this.chains.set(key, next);
    next.catch((e) => { Diag.add("write:" + key, e); }); next.catch((e) => toast(e?.code === "quota_exceeded" ? "Espaço de armazenamento cheio. Apague dias antigos ou fotos." : "Não consegui salvar agora. Tente de novo em instantes."));
    return next;
  },
  saveMain(m) { return this.write("main", () => this.mainRef(), m); },
  saveDay(d, data) { return this.write("day:" + d, () => this.dayRef(d), data); },
};

  if (o.step === 2) body = `<div class="stack"><h1 class="xl">Altura e peso</h1><div class="grid2"><div class="field"><label for="ht">Altura (cm)</label><input class="input num" id="ht" inputmode="numeric" placeholder="165" value="${esc(o.height)}" data-onb="height"></div><div class="field"><label for="wt">Peso atual (kg)</label><input class="input num" id="wt" inputmode="decimal" placeholder="70" value="${esc(o.weight)}" data-onb="weight"></div></div>${o.goal !== "maintain" ? `<div class="field"><label for="tg">Peso que você quer alcançar (kg)</label><input class="input num" id="tg" inputmode="decimal" placeholder="—" value="${esc(o.target)}" data-onb="target"><span class="hint">Opcional. Aparece no gráfico de progresso.</span></div>` : ""}</div>`;

  <div class="actionbar"><div class="inner"><button class="btn primary lg" data-act="onb-next" ${valid ? "" : "disabled"}>${o.step === 4 ? "Começar" : "Continuar"}</button></div></div>`;

// aceita "1.390", "1.390,5", "72,5" e "72.5"
const num = (v) => { let x = String(v ?? "").trim().replace(/\s/g, ""); if (x.includes(",")) x = x.replace(/\./g, "").replace(",", "."); else if (/^\d{1,3}(\.\d{3})+$/.test(x)) x = x.replace(/\./g, ""); return Number(x); };
const plain = (v) => String(r1(v)).replace(".", ",");
const PACE = { slow: ["Devagar", 0.1, 0.05], mid: ["Moderado", 0.2, 0.1], fast: ["Mais rápido", 0.25, 0.15] };
function paceSeg(cur, act) {
  return `<div class="field" style="margin-top:4px"><span class="lbl">Ritmo</span><div class="seg" role="group" aria-label="Ritmo">${Object.entries(PACE).map(([k, v]) => `<button aria-pressed="${cur === k}" data-act="${act}" data-f="pace" data-v="${k}">${v[0]}</button>`).join("")}</div><span class="hint">Mais rápido pede mais restrição e é mais difícil de manter. Moderado é o ponto de partida mais comum.</span></div>`;
}
function projection(pr, g) {
  const tdee = g.tdee, delta = Math.abs(tdee - g.kcal);
  if (pr.goal === "maintain" || !delta) return "";
  const perMonth = (delta * 30) / 7700;
  let line = `No ritmo escolhido, cerca de ${fmt1(perMonth)} kg por mês.`;
  const t = num(pr.target), w = num(pr.weight);
  if (t && ((pr.goal === "lose" && t < w) || (pr.goal === "gain" && t > w))) {
    const d = new Date(); d.setDate(d.getDate() + Math.round((Math.abs(w - t) / perMonth) * 30));
    line += ` Chegaria a ${fmt1(t)} kg por volta de ${MO[d.getMonth()]} de ${d.getFullYear()}.`;
  }
  return `<div class="panel sm"><b>Estimativa</b><br>${line}<br><span class="muted">O peso oscila de um dia para o outro; a tendência de semanas é o que conta.</span></div>`;
}
function onbValid(o) {
  if (o.step === -1) { const n = String(o.name || "").trim(); return n.length >= 1 && n.length <= 40; }
  if (o.step === 1) { const y = num(o.birthYear); const a = new Date().getFullYear() - y; return y && a >= 13 && a <= 100; }
  if (o.step === 2) { const h = num(o.height), w = num(o.weight); return h >= 100 && h <= 230 && w >= 30 && w <= 300 && (!o.target || (num(o.target) >= 30 && num(o.target) <= 300)); }
  return true;
}

/* ---------- S05 Hoje */
function macroBar(name, val, goal, color) {
  const pct = goal ? Math.min(100, (val / goal) * 100) : 0;
  return `<div class="mbar" aria-label="${name}, ${fmt(val)} de ${fmt(goal)} gramas"><div class="head"><span><span class="dot" style="background:var(${color})"></span>${name}</span><span class="num"><b>${fmt(val)}</b><span class="muted"> / ${fmt(goal)} g</span></span></div><div class="track"><div class="fill" style="width:${pct}%;background:var(${color})"></div></div></div>`;
}
function ring(eaten, goal) {
  const R = 74, C = 2 * Math.PI * R;
  if (healthFlags().ed) return `<div class="ring" role="img" aria-label="${fmt(eaten)} calorias registradas hoje"><svg viewBox="0 0 168 168"><circle cx="84" cy="84" r="${R}" fill="none" stroke="var(--track)" stroke-width="14"/></svg><div class="center"><span class="big num">${fmt(eaten)}</span><span class="xs muted">kcal registradas</span></div></div>`;
  const over = eaten > goal;
  const near = Math.abs(eaten - goal) <= goal * 0.05;
  const frac = Math.min(1, goal ? eaten / goal : 0);
  const color = over && !near ? "var(--warning)" : near ? "var(--success)" : "var(--accent)";
  const left = goal - eaten;
  return `<div class="ring" role="img" aria-label="${fmt(eaten)} de ${fmt(goal)} calorias consumidas, ${left >= 0 ? fmt(left) + " restantes" : fmt(-left) + " acima da meta"}">
    <svg viewBox="0 0 168 168"><circle cx="84" cy="84" r="${R}" fill="none" stroke="var(--track)" stroke-width="14"/><circle class="arc" cx="84" cy="84" r="${R}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg>
    <div class="center"><span class="big num">${fmt(Math.abs(left))}</span><span class="xs muted">${left >= 0 ? "kcal restantes" : "kcal acima"}</span></div></div>`;
}

/* ---------- S10 busca */
function vSearch(t) {
  const tab = t.tab || "res";
  const q = t.q || "";
  let list = "";
  const quick = t.target === "draft";
  const row = (f) => { const p = portionsFor(f)[0]; const k = (f.kcal * p[1]) / 100; return `<div class="res-row"><button class="res" data-act="pick-food" data-ref="${f.ref}"><span class="grow" style="flex:1;min-width:0"><span class="t" style="display:block">${esc(f.name)}</span><span class="xs muted num">${fmt(k)} kcal · ${esc(p[0])}${p[0] !== "100 g" ? ` (${p[1]} g)` : ""}</span></span><span class="src">${f.src}</span></button>${quick ? `<button class="add-btn" data-act="quick-add" data-ref="${f.ref}" aria-label="Adicionar ${esc(f.name)}, ${esc(p[0])}">${ic("plus")}</button>` : ""}</div>`; };
  if (q.trim()) {
    const res = searchFoods(q);
    list = res.length ? res.map(row).join("") : `<div class="empty">${ic("search")}<p>Nada com “${esc(q)}”. Tente outra palavra, sem detalhes, ou crie o alimento.</p><button class="btn secondary" data-act="new-custom">Criar alimento</button></div>`;
  } else if (tab === "rec" || tab === "res") {
    const r = S.main.recents.map(foodByRef).filter(Boolean);
    list = r.length ? `<p class="label" style="margin-top:4px">Recentes</p>` + r.map(row).join("") : `<div class="empty">${ic("search")}<p>Digite um alimento: “arroz”, “cuscuz”, “banana prata”.</p></div>`;
  } else if (tab === "fav") {
    const r = S.main.favs.map(foodByRef).filter(Boolean);
    list = r.length ? r.map(row).join("") : `<div class="empty">${ic("star")}<p>Toque na estrela de um alimento para ele aparecer aqui.</p></div>`;
  } else if (tab === "mine") {
    list = (customFoods.length ? customFoods.map(customToFood).map(row).join("") : `<div class="empty">${ic("label")}<p>Alimentos que você cria aparecem aqui, como produtos de mercado.</p></div>`);
  } else if (tab === "saved") {
    list = S.main.saved.length ? S.main.saved.map((m) => `<button class="res" data-act="use-saved" data-id="${m.id}"><span class="grow" style="flex:1;min-width:0"><span class="t" style="display:block">${esc(m.name)}</span><span class="xs muted">${m.items.length} itens · ${fmt(sum(m.items).kcal)} kcal</span></span></button>`).join("") : `<div class="empty">${ic("star")}<p>Abra uma refeição registrada e toque em “Salvar para repetir”.</p></div>`;
  }
  const tb = (k, n) => `<button role="tab" aria-selected="${tab === k}" data-act="s-tab" data-k="${k}">${n}</button>`;
  return `<div class="shell full"><div class="stack" style="gap:12px">${topbar(t.target === "draft" ? "Adicionar alimento" : t.target === "swap" ? "Trocar alimento" : "Buscar alimento", { right: t.target === "draft" && S.draft?.items.length ? `<button class="btn primary" data-act="done-search" style="min-height:40px;padding:0 14px">Concluído <span class="count" style="background:var(--on-accent);color:var(--accent)">${S.draft.items.length}</span></button>` : "" })}
    <div class="search">${ic("search")}<input class="input" id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Buscar alimento" value="${esc(q)}" aria-label="Buscar alimento"></div>
    ${q.trim() ? "" : `<div class="tabs" role="tablist">${tb("res", "Recentes")}${tb("fav", "Favoritos")}${tb("mine", "Meus")}${t.target !== "swap" ? tb("saved", "Refeições") : ""}</div>`}
    <div id="results">${list}</div>
    <div class="row" style="flex-wrap:wrap">${t.target === "draft" ? `<button class="btn ghost" data-act="open-quick">${ic("plus")} Só as calorias</button>` : ""}<button class="btn ghost" data-act="new-custom">${ic("plus")} Criar alimento</button>${AI.images ? `<button class="btn ghost" data-act="read-label">${ic("label")} Ler rótulo com a câmera</button>` : ""}</div>
    <p class="xs muted">Dados: TACO 4ª ed., NEPA/Unicamp; IBGE, POF 2008–2009.</p>
  </div></div>`;
}

/* ---------- S11 detalhe do alimento */
function vFood(t) {
  const f = foodByRef(t.ref);
  if (!f) return `<div class="shell">${topbar("Alimento")}<p>Alimento não encontrado.</p></div>`;
  const ports = portionsFor(f);
  const sel = t.portion ?? 0;
  const qty = t.qty ?? 1;
  const grams = r0(ports[sel][1] * num(qty || 0));
  const it = itemFrom(f, grams || 0);
  const fav = S.main.favs.includes(f.ref);
  return `<div class="shell full"><div class="stack">${topbar(shortName(f.name), { right: `<button class="icon-btn" data-act="fav" data-ref="${f.ref}" aria-pressed="${fav}" aria-label="${fav ? "Tirar dos favoritos" : "Favoritar"}">${ic("star", fav ? 'fill="currentColor" style="color:var(--warning)"' : "")}</button>` })}
    <div><p class="lg" style="overflow-wrap:anywhere">${esc(f.name)}</p><p class="sm muted">${esc(f.cat)} · ${f.src === "Meu" ? "Meu alimento" : f.src}</p></div>
    <div class="field"><span class="lbl">Medida</span><div class="chips">${ports.map((p, i) => `<button class="chip" aria-pressed="${i === sel}" data-act="f-port" data-i="${i}">${esc(p[0])}${p[0] !== "100 g" ? ` <span class="xs" style="opacity:.75">${p[1]} g</span>` : ""}</button>`).join("")}</div></div>
    <div class="field"><label for="f-qty">Quantidade</label><div class="stepper"><div class="box"><button data-act="f-q" data-d="-0.5" aria-label="Menos meia medida">−</button><input type="number" inputmode="decimal" step="0.5" min="0.5" id="f-qty" value="${qty}"><button data-act="f-q" data-d="0.5" aria-label="Mais meia medida">+</button></div><span class="sm muted num" id="f-g">= ${fmt(grams)} g</span></div></div>
    <div class="card" id="f-card">${foodCard(f, grams)}</div>
  </div></div>
  <div class="actionbar"><div class="inner"><button class="btn primary lg" id="f-add" data-act="food-add" ${grams > 0 ? "" : "disabled"}>${foodAddLabel(t, f, grams)}</button></div></div>`;
}
function foodGrams(t, f) { const ports = portionsFor(f); return r0(ports[t.portion ?? 0][1] * (num(t.qty ?? 1) || 0)); }
const foodAddLabel = (t, f, grams) => `${t.target === "swap" ? "Usar este alimento" : "Adicionar"} · ${fmt(itemFrom(f, grams || 0).kcal)} kcal`;
function liveFood() {
  const t = top(), f = foodByRef(t.ref); if (!f) return;
  const grams = foodGrams(t, f);
  const g = $("#f-g"), card = $("#f-card"), btn = $("#f-add");
  if (g) g.textContent = `= ${fmt(grams)} g`;
  if (card) card.innerHTML = foodCard(f, grams);
  if (btn) { btn.textContent = foodAddLabel(t, f, grams); btn.disabled = !(grams > 0); }
}
function foodCard(f, grams) {
  const it = itemFrom(f, grams || 0);
  return `<div class="row" style="justify-content:space-between"><span class="label">Nesta quantidade</span><span class="xl num">${fmt(it.kcal)}<span class="sm muted"> kcal</span></span></div>
      <table class="nut"><tbody><tr><td><span class="dot" style="background:var(--protein)"></span>Proteína</td><td>${fmt1(it.p)} g</td></tr><tr><td><span class="dot" style="background:var(--carbs)"></span>Carboidrato</td><td>${fmt1(it.c)} g</td></tr><tr><td><span class="dot" style="background:var(--fat)"></span>Gordura</td><td>${fmt1(it.f)} g</td></tr><tr><td>Fibra</td><td>${fmt1(it.fib)} g</td></tr><tr><td>Sódio</td><td>${f.na == null ? "—" : fmt(f.na * grams / 100) + " mg"}</td></tr></tbody></table>
      <p class="xs muted" style="margin-top:8px">Fonte: ${f.src === "TACO" ? "Tabela Brasileira de Composição de Alimentos (TACO), 4ª ed., NEPA/Unicamp" : f.src === "IBGE" ? "Tabelas de Composição Nutricional dos Alimentos Consumidos no Brasil, IBGE (POF 2008–2009)" : "informado por você"}.</p>`;
}

/* ---------- S13 texto */

/* ---------- S14 detalhe da refeição */
function vMeal(t) {
  const m = S.day?.meals.find((x) => x.id === t.id);
  if (!m) return `<div class="shell">${topbar("Refeição")}<div class="empty"><p>Esta refeição não existe mais.</p></div></div>`;
  const tot = sum(m.items);
  const confirm = S.confirm === "del-meal" ? `<div class="confirm" role="alert"><b>Apagar esta refeição?</b><span class="sm muted">${m.items.length} itens, ${fmt(tot.kcal)} kcal, saem do dia.</span><div class="row"><button class="btn secondary" data-act="cancel-confirm">Manter</button><button class="btn danger" data-act="del-meal" data-id="${m.id}">Apagar</button></div></div>` : "";
  return `<div class="shell full"><div class="stack">${topbar(mealName(m.type))}
    ${m.thumb ? `<img class="photo-hero" src="${m.thumb}" alt="Foto da refeição">` : ""}
    <div class="row"><div class="grow"><p class="xl num">${fmt(tot.kcal)} <span class="lg muted">kcal</span></p><p class="sm muted">${esc(dayLabel(S.date))}, ${esc(m.at.slice(11, 16))}</p></div></div>
    <div class="card">${macroBar("Proteína", tot.p, goalFor().p, "--protein")}<div style="height:12px"></div>${macroBar("Carboidrato", tot.c, goalFor().c, "--carbs")}<div style="height:12px"></div>${macroBar("Gordura", tot.f, goalFor().f, "--fat")}<p class="xs muted" style="margin-top:10px">Barras em relação à meta do dia.</p></div>
    <div class="card" style="padding-block:4px">${m.items.map((i) => `<div class="list-row"><div class="grow" style="flex:1;min-width:0"><div style="font-weight:500;overflow-wrap:anywhere">${esc(i.name)}</div><div class="xs muted num">${fmt(i.grams)} g${i.portion ? " · " + esc(i.portion) : ""}</div></div><span class="num sm" style="font-weight:600">${fmt(i.kcal)} kcal</span></div>`).join("")}</div>
    ${mealAnalysis(m, tot)}
    ${confirm}
    <div class="grid2"><button class="btn secondary" data-act="save-as" data-id="${m.id}">${ic("star")} Salvar para repetir</button><button class="btn secondary" data-act="ask-del-meal" style="color:var(--danger)">${ic("trash")} Apagar</button></div>
  </div></div>
  <div class="actionbar"><div class="inner"><button class="btn primary lg" data-act="edit-meal" data-id="${m.id}">Editar refeição</button></div></div>`;
}

/* ---------- análise da refeição */
function mealAnalysis(m, tot) {
  const kP = tot.p * 4, kC = tot.c * 4, kF = tot.f * 9, all = kP + kC + kF || 1;
  const seg = (k, c, n) => { const pc = Math.round((k / all) * 100); return pc ? `<div style="flex:${pc};background:var(${c});min-width:4px" title="${n} ${pc}%"></div>` : ""; };
  const pct = (k) => Math.round((k / all) * 100);
  const budget = goalFor().kcal * SPLIT[m.type];
  const a = S.analysis?.[m.id];
  let tips = "";
  if (AI.sample) {
    if (!a) tips = `<button class="btn secondary block" data-act="analyze-meal" data-id="${m.id}">${ic("pen")} Pedir dicas para esta refeição</button>`;
    else if (a.loading) tips = `<p class="sm muted">Analisando a refeição…</p><div class="sk"></div>`;
    else if (a.err) tips = `<p class="err">${esc(a.err)}</p><button class="btn secondary" data-act="analyze-meal" data-id="${m.id}">Tentar de novo</button>`;
    else tips = [["Porções", a.porcoes], ["Uma troca possível", a.troca], ["Para a próxima refeição", a.proxima]].filter((x) => x[1]).map(([h, t]) => `<div><p class="label" style="margin-bottom:4px">${h}</p><p class="sm">${esc(t)}</p></div>`).join("") + `<p class="xs muted">Sugestões geradas pelo Claude a partir dos itens registrados. Podem conter erros; não substituem orientação profissional.</p>`;
  }
  return `<section class="card stack" style="gap:12px" aria-label="Análise da refeição"><h2 class="lg">Análise</h2>
    <p class="sm num">${shareText(mealShare(m, S.day))}</p>
    <p class="sm num muted">Previsto para ${mealName(m.type).toLowerCase()}: ~${fmt(budget)} kcal. Esta ficou em ${Math.round((tot.kcal / budget) * 100)}% do previsto.</p>
    <div><div style="display:flex;gap:3px;height:14px;border-radius:999px;overflow:hidden" aria-hidden="true">${seg(kP, "--protein", "Proteína")}${seg(kC, "--carbs", "Carboidrato")}${seg(kF, "--fat", "Gordura")}</div>
    <p class="xs muted num" style="margin-top:6px"><span class="dot" style="background:var(--protein)"></span>Proteína ${pct(kP)}% · <span class="dot" style="background:var(--carbs)"></span>Carboidrato ${pct(kC)}% · <span class="dot" style="background:var(--fat)"></span>Gordura ${pct(kF)}% das calorias</p></div>
    ${tips}</section>`;
}

/* ---------- análise dos horários das refeições */
function timingStats() {
  const LONG = 300, week = S.week || [];

  const days = week.map((d) => {
    const ts = [...new Set(d.times)].map(toMin).sort((a, b) => a - b);
    const gaps = []; for (let i = 1; i < ts.length; i++) gaps.push({ a: ts[i - 1], b: ts[i], m: ts[i] - ts[i - 1] });
    const overnight = ts.length && prevLast != null ? ts[0] + 1440 - prevLast : null;
    prevLast = ts.length ? ts[ts.length - 1] : null;
    return { date: d.date, ts, gaps, overnight };
  });
  const logged = days.filter((d) => d.ts.length);
  const all = logged.flatMap((d) => d.gaps.map((g) => ({ ...g, date: d.date })));
  const worst = all.reduce((x, g) => (!x || g.m > x.m ? g : x), null);
  const ov = logged.map((d) => d.overnight).filter((x) => x != null && x < 1440);
  const firsts = logged.map((d) => d.ts[0]);
  return { LONG, days, logged, worst, longDays: logged.filter((d) => d.gaps.some((g) => g.m >= LONG)), ovAvg: ov.length ? ov.reduce((a, b) => a + b, 0) / ov.length : null, firstAvg: firsts.length ? firsts.reduce((a, b) => a + b, 0) / firsts.length : null };
}
const hm = (m) => `${pad(Math.floor(m / 60) % 24)}:${pad(Math.round(m % 60))}`;
function timingCard() {
  if (!S.week) return "";

  const W = 340, L = 34, Rr = 8, rowH = 22, T = 6, H = T + st.days.length * rowH + 18, x0 = 300, x1 = 1440;
  const X = (m) => L + ((Math.min(Math.max(m, x0), x1) - x0) * (W - L - Rr)) / (x1 - x0);
  const rows = st.days.map((d, i) => { const y = T + i * rowH + rowH / 2;
    const segs = d.gaps.map((g) => `<line x1="${X(g.a).toFixed(1)}" x2="${X(g.b).toFixed(1)}" y1="${y}" y2="${y}" stroke="${g.m >= st.LONG ? "var(--warning)" : "var(--track)"}" stroke-width="${g.m >= st.LONG ? 4 : 3}" stroke-linecap="round"/>`).join("");
    const dots = d.ts.map((m) => `<circle cx="${X(m).toFixed(1)}" cy="${y}" r="5" fill="var(--link)" stroke="var(--raised)" stroke-width="1.5"/>`).join("");

  const ticks = [6, 9, 12, 15, 18, 21, 24].map((h) => `<line x1="${X(h * 60)}" x2="${X(h * 60)}" y1="${T}" y2="${H - 16}" stroke="var(--border)" stroke-width="1"/><text x="${X(h * 60)}" y="${H - 4}" text-anchor="middle">${h}h</text>`).join("");
  const lines = [];
  if (st.worst) lines.push(`Maior intervalo durante o dia: <b>${dur(st.worst.m)}</b> (${WD[parseYmd(st.worst.date).getDay()]}, das ${hm(st.worst.a)} às ${hm(st.worst.b)}).`);

async function runBioAI(file) {

  push(t);
  aiCtl = new AbortController();
  try {
    const r = await AI.sample.json(`A imagem é o resultado de uma avaliação de bioimpedância (balança de bioimpedância, laudo de clínica ou print de aplicativo).
Leia os valores e responda SOMENTE com JSON:

- Se um valor não aparecer, use null. Se a gordura vier só em kg e o peso existir, converta para %. Se a água vier em litros ou kg e o peso existir, converta para %.

  } catch (err) {
    if (err?.code === "cancelled") { pop(); return; }
    t.state = "err"; t.retry = false; t.manual = "bio"; t.msg = AI_ERR[err?.code] || "A leitura falhou. Tente de novo ou digite os números.";
    render();
  }
}

function lineChart(pts, target) {
  const W = 340, H = 160, L = 34, Rr = 8, T = 10, B = 24;
  const vals = pts.map((p) => p[1]).concat(target ? [target] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  lo = Math.floor(lo); hi = Math.ceil(hi);
  const x = (i) => L + (i * (W - L - Rr)) / Math.max(1, pts.length - 1);
  const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
  const ticks = [lo, (lo + hi) / 2, hi];
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const area = `${path}L${x(pts.length - 1).toFixed(1)},${H - B}L${x(0).toFixed(1)},${H - B}Z`;
  const lastI = pts.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}">${ticks.map((v) => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt1(v)}</text>`).join("")}
    ${target ? `<line x1="${L}" x2="${W - Rr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--border-input)" stroke-dasharray="4 4" stroke-width="1.5"/>` : ""}
    <path d="${area}" fill="var(--accent)" fill-opacity=".10"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(lastI)}" cy="${y(pts[lastI][1])}" r="4.5" fill="var(--accent)" stroke="var(--raised)" stroke-width="2"/>
    <text x="${x(0)}" y="${H - 6}" text-anchor="start">${esc(dayLabel(pts[0][0]))}</text><text x="${x(lastI)}" y="${H - 6}" text-anchor="end">${esc(dayLabel(pts[lastI][0]))}</text></svg>`;
}
function barChart(days, goal) {
  const W = 340, H = 170, L = 8, Rr = 8, T = 16, B = 26;
  const max = Math.max(goal * 1.2, ...days.map((d) => d.kcal));
  const bw = (W - L - Rr) / days.length;
  const y = (v) => T + (H - T - B) * (1 - v / max);
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${L}" x2="${W - Rr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--border-input)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W - Rr}" y="${y(goal) - 5}" text-anchor="end">meta ${fmt(goal)}</text>
    ${days.map((d, i) => { const h = H - B - y(d.kcal); const over = d.kcal > goal * 1.05; return `<rect x="${(L + i * bw + bw * 0.2).toFixed(1)}" y="${y(d.kcal).toFixed(1)}" width="${(bw * 0.6).toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="5" fill="${over ? "var(--warning)" : "var(--accent)"}"/><text x="${(L + i * bw + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${WD[parseYmd(d.date).getDay()]}</text>`; }).join("")}</svg>`;
}
async function loadWeek() {
  S.week = null;

  S.week = Array.from({ length: 7 }, (_, i) => { const d = addDays(from, i); const t = sum(dayItems(by.get(d))); return { date: d, ...t, water: by.get(d)?.water || 0, times: times(d) }; });
  S.weekPrev = times(addDays(from, -1));

let aiCtl = null;
async function thumbOf(file, max = 640, q = 0.72) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", q);
  } catch { return null; }
}
const AI_ERR = {
  not_granted: "Esta conta não está autorizada a usar a IA. A busca na tabela continua funcionando.",
  sampling_disabled: "A IA não está configurada: confira a chave da API do Claude e os créditos no Supabase.",
  rate_limited: "Muitas análises em pouco tempo ou limite de uso atingido. Espere um pouco e tente de novo.",
  image_rejected: "Não consegui abrir esta foto. Tente outra, em JPEG ou PNG.",
  images_unavailable: "Este aparelho não consegue enviar fotos para o Claude por aqui.",
  invalid_json: "A resposta veio num formato inesperado. Tente de novo.",
  session_expired: "Sua sessão expirou. Feche e abra o app para entrar de novo.",
  refused: "O Claude não analisou esta imagem. Tente outra foto ou busque manualmente.",
};
async function runMealAI(kind, payload) {
  const t = { v: "analyzing", kind, state: "load", thumb: payload.thumb, text: payload.text, payload };
  if (top()?.v === "analyzing") S.stack[S.stack.length - 1] = t; else push(t);
  render();
  aiCtl = new AbortController();
  try {
    const opts = { signal: aiCtl.signal };
    if (kind === "photo") opts.images = [payload.file];
    const res = await AI.sample.json(AI.mealPrompt(kind, payload.text || ""), opts);
    const items = (Array.isArray(res?.items) ? res.items : []).slice(0, 15).map((x) => {
      const grams = Math.max(1, Math.min(1500, r0(x.grams) || 100));
      const f = foodByRef(x.ref ? String(x.ref) : x.taco_id ? "t" + x.taco_id : null);
      let it;
      if (f) it = itemFrom(f, grams);
      else {
        const p = x.per100 || {};
        it = itemFrom({ name: String(x.label || "Alimento").slice(0, 80), ref: null, kcal: +p.kcal || 0, p: +p.protein || 0, c: +p.carbs || 0, f: +p.fat || 0, fib: +p.fiber || 0 }, grams);
      }
      it.aiLabel = String(x.label || "").slice(0, 80);
      it.conf = Math.max(0, Math.min(1, Number(x.confidence) || 0.5));
      // F2: se a pessoa já corrigiu esse rótulo antes, usa a escolha dela
      const learned = foodByRef((S.main.learn || {})[norm(it.aiLabel)]);
      if (learned && learned.ref !== it.ref) { const g2 = it.grams, lab = it.aiLabel; it = itemFrom(learned, g2); it.aiLabel = lab; it.conf = 0.9; it.learned = true; }
      return it;
    });
    if (!items.length) {
      t.state = "err"; t.retry = false;
      t.msg = res?.note ? String(res.note).slice(0, 200) : kind === "photo" ? "Não encontrei comida nesta foto." : "Não entendi o que foi comido.";
      render(); return;
    }
    S.draft = newDraft({ source: kind, thumb: payload.small || payload.thumb, items, note: String(res?.note || "").slice(0, 200) });
    S.stack[S.stack.length - 1] = { v: "review" };
    render();
  } catch (e) {
    if (e?.code === "cancelled") { pop(); return; }
    t.state = "err"; t.retry = !["not_granted", "sampling_disabled", "images_unavailable", "refused"].includes(e?.code);
    t.msg = AI_ERR[e?.code] || "A análise falhou por um problema de conexão. Tente de novo.";
    render();
  }
}
async function runLabelAI(file) {
  const thumb = await thumbOf(file, 640);
  const t = { v: "analyzing", kind: "label", state: "load", thumb };
  push(t);
  aiCtl = new AbortController();
  try {
    const r = await AI.sample.json(AI.labelPrompt(), { images: [file], signal: aiCtl.signal });
    if (!r || r.readable === false || !r.per_portion) { t.state = "err"; t.retry = false; t.msg = "Não consegui ler a tabela. Tire a foto mais de perto, com boa luz, ou preencha à mão."; t.manual = true; render(); return; }
    const pp = r.per_portion;
    const c = { name: String(r.name || "").slice(0, 80), portionG: r0(r.portion_g) || 100, portionLabel: String(r.portion_label || "").slice(0, 40), pk: r1(pp.kcal), pp: r1(pp.protein), pc: r1(pp.carbs), pf: r1(pp.fat), pfib: r1(pp.fiber), pna: r0(pp.sodium_mg) };
    S.stack[S.stack.length - 1] = { v: "custom", c, fromLabel: true, then: S.stack[S.stack.length - 2]?.v === "search" ? "pick" : null };
    render();
  } catch (e) {
    if (e?.code === "cancelled") { pop(); return; }
    t.state = "err"; t.retry = false; t.msg = AI_ERR[e?.code] || "A leitura falhou. Tente de novo ou preencha à mão.";
    render();
  }
}

    try { const r = await AI.sample.json(prompt, { modelTier: "default" }); S.bioEval = { resumo: String(r?.resumo || "").slice(0, 400), alimentacao: String(r?.alimentacao || "").slice(0, 400), agua: String(r?.agua || "").slice(0, 400), proximo: String(r?.proximo || "").slice(0, 400) }; }
    catch (e) { S.bioEval = { err: AI_ERR[e?.code] || "Não consegui fazer a leitura agora." }; }
    if (!top() && S.tab === "corpo") render();
  },
  "add-to-draft"() { push({ v: "search", target: "draft" }); },
  swap(el) { const i = Number(el.dataset.i); const it = S.draft.items[i]; push({ v: "search", target: "swap", swapIndex: i, q: shortName(it.aiLabel || it.name).split(" ")[0] }); },
  "rm-item"(el) { const i = Number(el.dataset.i); const [it] = S.draft.items.splice(i, 1); render(); toast(`${shortName(it.name)} removido`, () => { S.draft.items.splice(i, 0, it); render(); }); },
  g(el) { const it = S.draft.items[Number(el.dataset.i)]; regrams(it, Math.max(1, it.grams + Number(el.dataset.d))); it.conf = null; it.portion = ""; render(); },
  "g-set"(el) { const it = S.draft.items[Number(el.dataset.i)]; regrams(it, Number(el.dataset.g)); it.portion = el.dataset.l; it.conf = null; render(); },
  "draft-type"(el) { S.draft.type = el.dataset.k; render(); },
  "save-draft"() {
    const d = S.draft;
    if (!d.items.length) return;
    d.time = $("#d-time")?.value || d.time;
    const at = `${d.date}T${d.time}`;
    const meal = { id: d.editing ? d.id : uid(), type: d.type, at, source: d.source, thumb: d.thumb, items: d.items.map(({ per100, ...rest }) => ({ ...rest, per100 })) };
    if (d.editing) S.day.meals = S.day.meals.map((m) => (m.id === d.id ? meal : m));
    else S.day.meals.push(meal);
    for (const it of d.items) pushRecent(it.ref);
    saveDay(); saveMain();
    S.draft = null; S.pendingMeal = null; S.week = null;
    resetTo("hoje");
    toast(d.editing ? "Refeição atualizada" : `${mealName(meal.type)} salvo · ${fmt(sum(meal.items).kcal)} kcal`);
  },
  "open-meal"(el) { S.confirm = null; push({ v: "meal", id: el.dataset.id }); },
  "edit-meal"(el) {
    const m = S.day.meals.find((x) => x.id === el.dataset.id);
    S.draft = { id: m.id, source: m.source, thumb: m.thumb, items: JSON.parse(JSON.stringify(m.items)), note: "", type: m.type, time: m.at.slice(11, 16), date: S.date, editing: true };
    S.stack[S.stack.length - 1] = { v: "review" }; render();
  },
  "ask-del-meal"() { S.confirm = "del-meal"; render(); },
  "ask-wipe"() { S.confirm = "wipe"; render(); },
  "cancel-confirm"() { S.confirm = null; render(); },
  "del-meal"(el) {
    const i = S.day.meals.findIndex((x) => x.id === el.dataset.id);
    const [m] = S.day.meals.splice(i, 1);
    saveDay(); S.confirm = null; S.week = null; resetTo("hoje");
    toast("Refeição apagada", () => { S.day.meals.push(m); saveDay(); render(); });
  },
  "save-as"(el) {
    const m = S.day.meals.find((x) => x.id === el.dataset.id);
    const name = `${mealName(m.type)}: ${m.items.slice(0, 3).map((i) => shortName(i.name)).join(", ")}`.slice(0, 80);
    S.main.saved = [{ id: uid(), name, type: m.type, items: m.items.map((i) => ({ ...i })) }, ...S.main.saved].slice(0, 30);
    saveMain(); toast("Salva em Refeições, na busca");
  },
  "use-saved"(el) {
    const m = S.main.saved.find((x) => x.id === el.dataset.id);
    S.draft.items.push(...m.items.map((i) => ({ ...JSON.parse(JSON.stringify(i)), id: uid(), conf: null })));
    if (!S.pendingMeal) S.draft.type = m.type;
    while (S.stack.length && top().v !== "review") S.stack.pop();
    if (!S.stack.length) S.stack.push({ v: "review" });
    render();
  },
  "del-saved"(el) { S.main.saved = S.main.saved.filter((x) => x.id !== el.dataset.id); saveMain(); render(); },
  "new-custom"() { push({ v: "custom", c: { name: top()?.q || "" }, then: top()?.v === "search" ? "pick" : null }); },
  "edit-custom"(el) { const c = customFoods.find((x) => x.id === el.dataset.id); const k = (c.portionG || 100) / 100; push({ v: "custom", c: { id: c.id, name: c.name, portionG: c.portionG || 100, portionLabel: c.portionLabel, pk: r1(c.kcal * k), pp: r1(c.p * k), pc: r1(c.c * k), pf: r1(c.f * k), pfib: r1(c.fib * k), pna: r0(c.na * k) } }); },
  "del-custom"(el) { const c = customFoods.find((x) => x.id === el.dataset.id); customFoods = customFoods.filter((x) => x.id !== c.id); saveMain(); render(); toast(`${c.name} apagado`, () => { customFoods.push(c); saveMain(); render(); }); },
  "read-label"() { $("#lbl").click(); },
  "save-custom"() {
    const v = (id) => num($("#" + id).value || 0);
    const name = $("#c-name").value.trim();
    const pg = v("c-pg"), kcal = v("c-kcal");
    const err = $("#c-err");
    if (!name) { err.textContent = "Dê um nome ao alimento."; $("#c-name").focus(); return; }
    if (!(pg > 0)) { err.textContent = "Informe o tamanho da porção em gramas (ou ml)."; $("#c-pg").focus(); return; }
    if (!(kcal >= 0) || [kcal, v("c-p"), v("c-c"), v("c-f")].some((x) => Number.isNaN(x) || x < 0)) { err.textContent = "Os valores precisam ser números, sem letras."; return; }
    const k = 100 / pg;
    const t = top();
    const rec = { id: t.c.id || uid(), name, portionG: r0(pg), portionLabel: $("#c-pl").value.trim() || `1 porção (${r0(pg)} g)`, kcal: r1(kcal * k), p: r1(v("c-p") * k), c: r1(v("c-c") * k), f: r1(v("c-f") * k), fib: r1(v("c-fib") * k), na: r0(v("c-na") * k) };
    customFoods = t.c.id ? customFoods.map((x) => (x.id === rec.id ? rec : x)) : [rec, ...customFoods];
    saveMain();
    toast("Alimento salvo");
    if (t.then === "pick") { const target = S.stack[S.stack.length - 2]; S.stack[S.stack.length - 1] = { v: "food", ref: "c" + rec.id, target: target?.target || "draft", swapIndex: target?.swapIndex, qty: 1, portion: 0 }; render(); }
    else pop();
  },
  "edit-goal"() { push({ v: "goal" }); },
  "goal-style"(el) {
    const s = STYLES[el.dataset.k], k = num($("#gk").value); if (!s || !(k > 0)) return;
    $("#gp").value = r0((k * s[1]) / 100 / 4); $("#gc").value = r0((k * s[2]) / 100 / 4); $("#gf").value = r0((k * s[3]) / 100 / 9); $("#gfib").value = r0((k / 1000) * s[4]);
    document.querySelectorAll('[data-act="goal-style"]').forEach((b) => b.setAttribute("aria-pressed", String(b === el)));
    S.goalStyle = el.dataset.k;
    $("#gk").dispatchEvent(new Event("input", { bubbles: true }));
  },
  "save-goal"() {
    const g = { style: S.goalStyle || goalFor().style || null, kcal: r0(num($("#gk").value)), water: r0(num($("#gw").value)), p: r0(num($("#gp").value)), c: r0(num($("#gc").value)), f: r0(num($("#gf").value)), fib: r0(num($("#gfib").value)) };
    if (!(g.kcal >= 800 && g.kcal <= 6000)) { $("#g-err").textContent = "Use uma meta entre 800 e 6.000 kcal."; return; }
    if ([g.p, g.c, g.f, g.fib, g.water].some((x) => !(x >= 0))) { $("#g-err").textContent = "Os valores precisam ser números positivos."; return; }
    S.main.goal = g; S.goalStyle = null; saveMain(); pop(); toast("Meta atualizada");
  },
  "edit-profile"() { S.pe = { ...S.main.profile }; push({ v: "profile" }); },
  "pe-set"(el) { keepPe(); S.pe[el.dataset.f] = el.dataset.v; render(); },
  "save-profile"() {
    keepPe(); const p = { ...S.pe, name: ($("#pe-name").value || "").trim().slice(0, 40), birthYear: $("#pe-by").value.trim(), height: num($("#pe-h").value), weight: num($("#pe-w").value), target: $("#pe-t").value.trim() ? num($("#pe-t").value) : "", activity: $("#pe-a").value };
    if (!onbValid({ step: 1, birthYear: p.birthYear }) || !onbValid({ step: 2, height: p.height, weight: p.weight, target: p.target })) { $("#pe-err").textContent = "Confira ano de nascimento (13 a 100 anos), altura (100–230 cm) e peso (30–300 kg)."; return; }
    S.main.profile = p; S.main.goal = calcGoal(p); S.main.weights[today()] = r1(p.weight);
    saveMain(); pop(); toast(`Nova meta: ${fmt(S.main.goal.kcal)} kcal`);
  },
  async export() {
    let days = [];
    try { days = await Store.getDays("2000-01-01", today()); } catch {}
    const rows = [["data", "hora", "refeicao", "alimento", "gramas", "kcal", "proteina_g", "carboidrato_g", "gordura_g", "fibra_g"]];
    for (const d of days.sort((a, b) => a.date.localeCompare(b.date))) for (const m of d.meals || []) for (const i of m.items) rows.push([d.date, m.at.slice(11, 16), mealName(m.type), i.name, i.grams, r1(i.kcal), r1(i.p), r1(i.c), r1(i.f), r1(i.fib)]);
    const csv = rows.map((r) => r.map((c) => /[",;\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(",")).join("\n");
    let dl = null;
    try { dl = await claude?.use?.("downloads"); } catch {}
    if (!dl) { toast("Exportar funciona quando o app é aberto no Claude."); return; }
    try { await dl.save({ filename: `prato-diario-${today()}.csv`, data: "﻿" + csv }); toast(`${rows.length - 1} itens exportados`); } catch { toast("Exportação cancelada."); }
  },
  async wipe() {
    const keepDate = S.date;
    S.main = { profile: null, goal: null, weights: {}, custom: [], favs: [], recents: [], saved: [] };
    customFoods = [];
    try { const days = await Store.getDays("2000-01-01", today()); for (const d of days) await Store.saveDay(d.date, emptyDay(d.date)); } catch {}
    await Store.saveMain(S.main);
    S.confirm = null; S.onb = null; S.day = emptyDay(keepDate); S.stack = []; S.tab = "hoje"; render();
  },
  "onb-set"(el) { S.onb[el.dataset.f] = el.dataset.v; render(); },
  "onb-back"() { S.onb.step--; render(); },
  "onb-next"() {
    const o = S.onb;
    if (!onbValid(o)) return;
    if (o.step < 4) { o.step++; render(); window.scrollTo(0, 0); return; }
    const p = { name: String(o.name || "").trim().slice(0, 40), goal: o.goal, pace: o.pace, sex: o.sex, birthYear: o.birthYear, height: num(o.height), weight: num(o.weight), target: o.target ? num(o.target) : "", activity: o.activity };
    S.main.profile = p; S.main.goal = calcGoal(p); S.main.weights[today()] = r1(p.weight);
    saveMain(); S.stack = [{ v: "quiz-intro" }]; render(); window.scrollTo(0, 0);
  },
  undo() { const u = S.undo; S.undo = null; $("#toast-slot").innerHTML = ""; u?.(); },
};
function keepPe() { const g = (id) => $("#" + id)?.value; if ($("#pe-by")) Object.assign(S.pe, { name: g("pe-name"), birthYear: g("pe-by"), height: g("pe-h"), weight: g("pe-w"), target: g("pe-t"), activity: g("pe-a") }); }
function keepQuizOther() { const el = $("#quiz-other"); if (el && S.quiz) { const q = quizList()[S.quiz.i]; S.quiz.a[q.id + "_other"] = el.value.trim().slice(0, 80); } }
function defaultPortion(ref, t) {
  const f = foodByRef(ref); if (!f) return 0;
  return 0; // primeira medida caseira (ou 100 g quando não há)
}

/* ------------------------------------------------------------------ eventos */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  const act = el.dataset.act;
  const fail = (err) => { Diag.add(act, err); toast("Algo falhou (" + act + "): " + String(err?.message || err?.code || err).slice(0, 120)); };
  try { const r = fn(el); if (r && typeof r.catch === "function") r.catch(fail); } catch (err) { fail(err); }
});
// diagnóstico: guarda os últimos erros na conta da pessoa (data/users/<id>/diag) para investigar
const Diag = {
  errs: [],
  add(where, e) {
    try {
      const rec = { at: new Date().toISOString(), where: String(where).slice(0, 40), msg: String(e?.message || e?.code || e).slice(0, 300), stack: String(e?.stack || "").slice(0, 800), view: (S.stack[S.stack.length - 1] || {}).v || S.tab, hasDay: !!S.day, date: S.date, draftItems: S.draft ? S.draft.items.length : null, store: Store.kind };
      this.errs = [...this.errs, rec].slice(-20);
      console.error("[diag]", rec);
      if (Store.kind === "db") Store.db.doc(`data/users/${Store.uid}/diag`).set({ errs: this.errs, ua: navigator.userAgent.slice(0, 200), build: "r3-diag" }).catch(() => {});
    } catch {}
  },
};
window.addEventListener("error", (e) => Diag.add("window", e.error || e.message));
window.addEventListener("unhandledrejection", (e) => Diag.add("promise", e.reason));
document.addEventListener("pointerdown", () => { S.ptr = true; }, true);
document.addEventListener("pointerup", () => { setTimeout(() => { S.ptr = false; }, 0); }, true);
document.addEventListener("pointercancel", () => { S.ptr = false; }, true);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (S.sheet) { S.sheet = null; render(); } else if (top()) actions.back(); }
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "q") { const t = top(); t.q = el.value; clearTimeout(S.qT); const run = () => { if (top()?.v !== "search") return; if (S.ptr) { S.qT = setTimeout(run, 120); return; } const pos = el.selectionStart; render(); const n = $("#q"); if (!n) return; n.focus(); try { n.setSelectionRange(pos, pos); } catch {} }; S.qT = setTimeout(run, 180); }
  if (el.dataset.onb) { S.onb[el.dataset.onb] = el.value; const b = $('[data-act="onb-next"]'); if (b) b.disabled = !onbValid(S.onb); }
  if (el.id === "f-qty") { top().qty = el.value; liveFood(); }
  if (el.id === "photo-hint") S.photoHint = el.value;
  if (el.dataset.grams != null && S.draft) { const it = S.draft.items[Number(el.dataset.grams)], n = r0(num(el.value)); if (it && n >= 1 && n <= 5000) { regrams(it, n); it.conf = null; it.portion = ""; liveReview(Number(el.dataset.grams)); } }
  if (el.id === "d-time" && S.draft) S.draft.time = el.value;
  if (["gk", "gp", "gc", "gf"].includes(el.id)) { const k = num($("#gk").value), m = num($("#gp").value) * 4 + num($("#gc").value) * 4 + num($("#gf").value) * 9; $("#g-sum").textContent = `Os macros somam ${fmt(m)} kcal${Math.abs(m - k) > 50 ? ` (a meta é ${fmt(k)})` : ""}.`; }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "day-note" && S.day) { S.day.note = el.value.slice(0, 1000); saveDay(); toast("Nota salva"); }
  if (el.id === "pick-date" && el.value) { S.loadErr = null; loadDay(el.value > today() ? today() : el.value); }
  if (el.id === "f-qty") { const t = top(); t.qty = Math.max(0.5, r1(num(el.value) || 1)); el.value = t.qty; liveFood(); }
  if (el.dataset.grams != null && S.draft) { const i = Number(el.dataset.grams), it = S.draft.items[i]; if (!it) return; const n = r0(num(el.value)); if (!(n >= 1 && n <= 5000)) el.value = it.grams; else if (n !== it.grams) { regrams(it, n); it.conf = null; it.portion = ""; liveReview(i); } }
  if (el.id === "cam" || el.id === "gal") { const f = el.files?.[0]; el.value = ""; if (f) startPhoto(f); }
  if (el.id === "lbl") { const f = el.files?.[0]; el.value = ""; if (f) runLabelAI(f); }
  if (el.id === "bio") { const f = el.files?.[0]; el.value = ""; if (f) runBioAI(f); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.dataset.form === "setname") {
    const n = ($("#nm-set").value || "").trim().slice(0, 40);
    if (!n) { $("#nm-set").focus(); return; }
    S.main.profile = { ...S.main.profile, name: n }; saveMain(); render(); toast(`Perfil de ${n}`);
    return;
  }
  if (e.target.dataset.form === "dayweight") {
    const w = num($("#dw-in").value);
    if (!(w >= 30 && w <= 300)) { toast("Informe um peso entre 30 e 300 kg."); return; }
    S.main.weights[S.date] = r1(w); saveMain(); S.week = null; render(); toast("Peso do dia registrado");
    return;
  }
  if (e.target.dataset.form === "weight") {
    const w = num($("#w-in").value);
    if (!(w >= 30 && w <= 300)) { toast("Informe um peso entre 30 e 300 kg."); return; }
    S.main.weights[today()] = r1(w); saveMain(); render(); toast("Peso registrado");
  }
});
async function startPhoto(file) {
  const hint = String($("#photo-hint")?.value ?? S.photoHint ?? "").trim().slice(0, 200);
  S.photoHint = ""; S.sheet = null;
  const thumb = await thumbOf(file, 640, 0.7);
  const small = await thumbOf(file, 320, 0.6);
  runMealAI("photo", { file, thumb, small, text: hint });
}

/* ------------------------------------------------------------------ início */
(async function boot() {
  render();
  await Promise.all([Store.init(), AI.init()]);
  try {
    const m = await Store.getMain();
    if (m) S.main = { profile: null, goal: null, weights: {}, custom: [], favs: [], recents: [], saved: [], ...m };
  } catch { S.loadErr = "Não consegui carregar seus dados agora. O que você registrar fica salvo quando a conexão voltar."; }
  customFoods = S.main.custom || [];
  S.ready = true;
  await loadDay(today());
})();
})();
